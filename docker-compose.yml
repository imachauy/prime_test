version: "3.8"

services:
  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    # volumes:
    #   - mongo_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - backend
    restart: on-failure

  fastapi-app:
    build:
      context: .
    ports:
      - "13861:7861"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - backend
    restart: on-failure

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
